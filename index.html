<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Дом">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=mvqzxq07">
  <title>Дом</title>
</head>
<body>
  <header class="top">
    <div class="top-left">
      <div class="home-name" id="home-name">Дом</div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div class="top-right">
      <button class="round" id="guard" data-status="disarmed" aria-label="Охрана">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
        <span class="guard-count" id="guard-text"></span>
      </button>
      <button class="round" id="menu" aria-label="Меню">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
  </header>

  <div class="alerts" id="alerts"></div>

  <main id="view-home">
    <section class="scenes" id="scenes"></section>
    <section class="rooms" id="rooms"></section>
  </main>

  <div class="conn" id="conn" hidden>Нет связи с домом…</div>

  <dialog class="sheet" id="sheet">
    <div class="sheet-body">
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-sub" id="sheet-sub"></div>
      <div class="sheet-actions" id="sheet-actions"></div>
      <div class="pin" id="pin" hidden>
        <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
        <div class="pin-pad" id="pin-pad"></div>
      </div>
      <button class="sheet-close" id="sheet-close">Закрыть</button>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="demo.js?v=mvqzxq07"></script>
  <script type="module" src="app.js?v=mvqzxq07"></script>
</body>
</html>
