<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Дом">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>Дом</title>
</head>
<body>
  <header class="top">
    <div class="top-left">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="home" class="active">Дом</button>
      <button data-view="log">Журнал</button>
    </nav>
    <div class="top-right">
      <button class="install" id="install" aria-label="Установить приложение" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        <span>Установить</span>
      </button>
      <button class="guard" id="guard" data-status="disarmed">
        <span class="guard-dot"></span>
        <span class="guard-text" id="guard-text">Охрана выключена</span>
      </button>
    </div>
  </header>

  <div class="alerts" id="alerts"></div>

  <main id="view-home">
    <section class="scenes" id="scenes"></section>
    <section class="rooms" id="rooms"></section>
  </main>

  <main id="view-log" hidden>
    <div class="notify" id="notify">
      <div class="row-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </div>
      <div class="row-text">
        <div class="row-label">Уведомления о тревогах</div>
        <div class="row-sub" id="notify-sub">Протечка, дым, проникновение — даже когда приложение закрыто</div>
      </div>
      <button class="pill-btn" id="notify-btn">Включить</button>
    </div>
    <ol class="log" id="log"></ol>
  </main>

  <div class="conn" id="conn" hidden>Нет связи с хабом — переподключаюсь…</div>

  <dialog class="sheet" id="sheet">
    <div class="sheet-body">
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-sub" id="sheet-sub"></div>
      <div class="sheet-actions" id="sheet-actions"></div>
      <div class="pin" id="pin" hidden>
        <div class="pin-dots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
        <div class="pin-pad" id="pin-pad"></div>
      </div>
      <button class="sheet-close" id="sheet-close">Закрыть</button>
    </div>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="demo.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
